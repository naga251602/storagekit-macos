name: Release (macOS arm64)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check version tag
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a semantic version tag, e.g. v5.4.1" >&2
            exit 1
          }
          echo "STORAGEKIT_VERSION=${tag#v}" >> "$GITHUB_ENV"
          echo "STORAGEKIT_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Run tests and Swift syntax check
        run: ./scripts/test.sh
      - name: Native Apple Silicon build
        run: ./build.sh
      - name: Verify app bundle and signature
        run: ./scripts/verify_bundle.sh
      - name: Create ZIP and SHA-256 checksum
        shell: bash
        run: |
          mkdir -p dist
          archive="StorageKit-${GITHUB_REF_NAME}-macos-arm64.zip"
          ditto -c -k --keepParent 'build/StorageKit.app' "dist/$archive"
          (cd dist && shasum -a 256 "$archive" > SHA256SUMS.txt)
      - name: Publish prerelease (ad-hoc signed, not notarized)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag \
            --prerelease \
            --title "StorageKit $GITHUB_REF_NAME (Apple Silicon)" \
            --notes "Automated arm64 build. Ad-hoc signed, NOT notarized or Developer ID signed. macOS Gatekeeper may require manual approval. Test with disposable data before using cleanup actions." \
            --generate-notes
